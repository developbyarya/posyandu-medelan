name: Supabase Ping

on:
  schedule:
    # Run at 03:00 UTC every 4 days
    - cron: '0 3 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "URL secret not set. Skipping."
            exit 0
          fi
          echo "Pinging Supabase PostgREST API..."
          curl -s -X GET "${SUPABASE_URL}/rest/v1/balita?limit=1" \
               -H "apikey: ${SUPABASE_ANON_KEY}" \
               -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
          echo "Ping complete."
